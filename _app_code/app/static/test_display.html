<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error/Warning 显示测试</title>
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; max-width: 1200px; margin: 20px auto; padding: 20px; background: #f5f5f5; }
        .container { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; margin-bottom: 20px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-right: 8px; cursor: help; }
        .badge-error { background: #fee2e2; color: #991b1b; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f9fafb; font-weight: 600; color: #374151; }
        tr:hover { background: #f9fafb; }
        .code { font-family: 'Consolas', monospace; font-size: 13px; }
        .legend { font-size: 12px; color: #6b7280; margin-top: 10px; padding: 10px; background: #f9fafb; border-radius: 4px; }
        .legend span { margin-right: 20px; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat-card { flex: 1; background: #f9fafb; padding: 15px; border-radius: 6px; }
        .stat-number { font-size: 32px; font-weight: 600; color: #374151; }
        .stat-label { font-size: 14px; color: #6b7280; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Error/Warning 级别显示测试</h1>
        <div class="subtitle">测试后端识别和前端展示 Error (Required) 和 Warning (Advisory) 的能力</div>

        <div class="legend">
            <span><strong>¹ Required (强制规则)</strong> — 可能有逻辑错误，一般要求改正 → <span class="badge badge-error">Error</span></span>
            <span><strong>² Advisory (推荐规则)</strong> — 潜在问题，不强制修复 → <span class="badge badge-warning">Warning</span></span>
        </div>
    </div>

    <div class="container">
        <h2>📊 统计信息</h2>
        <div class="stats" id="stats"></div>
    </div>

    <div class="container">
        <h2>🐛 缺陷列表</h2>
        <table id="bugsTable">
            <thead>
                <tr>
                    <th>级别</th>
                    <th>规则编号</th>
                    <th>文件</th>
                    <th>位置</th>
                    <th>检查器</th>
                    <th>消息</th>
                </tr>
            </thead>
            <tbody id="bugsBody"></tbody>
        </table>
    </div>

    <script>
        // 加载报告数据
        async function loadReport() {
            try {
                const response = await fetch('/api/reports/latest');
                if (!response.ok) {
                    // 如果 API 不存在，使用示例数据
                    return getSampleData();
                }
                const data = await response.json();
                return data.report;
            } catch (error) {
                console.log('使用示例数据');
                return getSampleData();
            }
        }

        function getSampleData() {
            return {
                "files_stats": [
                    {
                        "file_path": "control.c",
                        "bugs": [
                            { "checker": "clang-analyzer-gjb.style.MagicNumber", "file_path": "control.c", "line": 71, "column": 18,
                              "message": "[MOCK] 禁止使用魔数，应定义为常量", "rule_id": "GJB-R-1-7-3", "level": "Warning", "force": "0" },
                            { "checker": "clang-analyzer-gjb.branch.Brace", "file_path": "control.c", "line": 12, "column": 27,
                              "message": "[MOCK] 分支语句必须使用大括号", "rule_id": "GJB-R-1-3-8", "level": "Error", "force": "1" }
                        ]
                    },
                    {
                        "file_path": "diagnostics.c",
                        "bugs": [
                            { "checker": "clang-analyzer-gjb.style.MagicNumber", "file_path": "diagnostics.c", "line": 63, "column": 10,
                              "message": "[MOCK] 禁止使用魔数，应定义为常量", "rule_id": "GJB-R-1-7-3", "level": "Warning", "force": "0" }
                        ]
                    }
                ]
            };
        }

        function renderStats(report) {
            let errorCount = 0, warningCount = 0, totalBugs = 0;
            report.files_stats.forEach(file => {
                file.bugs.forEach(bug => {
                    totalBugs++;
                    if (bug.level === 'Error' || bug.force === '1') errorCount++;
                    else warningCount++;
                });
            });

            document.getElementById('stats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${totalBugs}</div>
                    <div class="stat-label">缺陷总数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #991b1b;">${errorCount}</div>
                    <div class="stat-label">Error (Required)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" style="color: #92400e;">${warningCount}</div>
                    <div class="stat-label">Warning (Advisory)</div>
                </div>
            `;
        }

        function renderBugs(report) {
            const tbody = document.getElementById('bugsBody');
            tbody.innerHTML = '';

            report.files_stats.forEach(file => {
                file.bugs.forEach(bug => {
                    const row = tbody.insertRow();
                    const isError = bug.level === 'Error' || bug.force === '1';
                    const levelText = isError ? 'Error ¹' : 'Warning ²';
                    const levelClass = isError ? 'badge-error' : 'badge-warning';
                    const title = isError ? 'Required (强制规则) — 可能有逻辑错误' : 'Advisory (推荐规则) — 潜在问题';

                    row.innerHTML = `
                        <td><span class="badge ${levelClass}" title="${title}">${levelText}</span></td>
                        <td class="code">${bug.rule_id}</td>
                        <td class="code">${bug.file_path}</td>
                        <td class="code">${bug.line}:${bug.column}</td>
                        <td class="code" style="font-size: 11px;">${bug.checker}</td>
                        <td>${bug.message}</td>
                    `;
                });
            });
        }

        // 初始化
        loadReport().then(report => {
            renderStats(report);
            renderBugs(report);
        });
    </script>
</body>
</html>
